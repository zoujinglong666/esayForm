# WebStorm 编辑器性能优化

# 禁用代码分析（严重影响性能但会失去实时错误提示）
# idea.cycle.buffer.size=disabled

# 增加撤销缓冲区
idea.max.intellisense.filesize=2500

# 禁用某些动画效果
ide.ui.animation.enabled=false
ide.ui.animations.disabled=true

# 减少自动保存频率
ide.check.autosave.files.only.on.focus.loss=true

# 优化文件监控
idea.file.watchers.enabled=true
ide.max.filesize.for.intellisense=2500

# 禁用插件热重载
idea.plugins.compatible.build=IU-241.18968.56
